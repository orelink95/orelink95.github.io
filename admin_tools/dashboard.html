<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athenaeum Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif:wght@700&display=swap"
        rel="stylesheet" />
    <!-- the item card preview uses the site's own card styles -->
    <link href="../styles/tokens.css" rel="stylesheet" />
    <link href="../styles/loot-card.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --gold: #e9c176;
            --gold-soft: #ffdea5;
            --green: #97d39e;
            --red: #ffb4ab;
            --bg: #0a0b0a;
            --panel: #121412;
            --panel-2: #1a1c1a;
            --line: rgba(255, 255, 255, .08);
            --ink: #e2e3df;
            --ink-dim: #a9ada6;
            --ink-faint: #6f736d;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 13px/1.45 'Manrope', sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        .material-symbols-outlined {
            font-size: 18px;
            vertical-align: middle;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2d2a;
            border-radius: 10px;
        }

        a {
            color: var(--gold);
        }

        [hidden] {
            display: none !important;
        }

        /* ---- gate ---- */
        #gate {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            text-align: center;
            padding: 24px;
        }

        #gate h1 {
            font: 600 34px 'Newsreader', serif;
            color: var(--gold);
            margin: 0;
        }

        #gate p {
            max-width: 460px;
            color: var(--ink-dim);
            margin: 0;
        }

        #gate .err {
            color: var(--red);
        }

        /* ---- layout ---- */
        #app {
            --nav-w: 150px;
            display: grid;
            grid-template-columns: var(--nav-w) var(--list-w, 290px) 1fr;
            height: 100vh;
        }

        #app.list-collapsed {
            --list-w: 0px;
        }

        /* One row per tool. Rows shrink with the window so that the whole menu stays
           visible; it only scrolls when the window is too short for the smallest rows.
           --c is the category colour, set per group in dashboard.js. */
        #nav {
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-right: 1px solid var(--line);
            overflow-y: auto;
            padding: 4px 6px 8px;
        }

        .nav-sec {
            display: contents;
        }

        .nav-group {
            flex: none;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: var(--c);
            margin: 8px 0 2px 8px;
        }

        .nav-btn {
            flex: 0 1 30px;
            min-height: 22px;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 0 8px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: none;
            color: var(--ink-dim);
            text-align: left;
            cursor: pointer;
        }

        .nav-btn .material-symbols-outlined {
            color: var(--c);
        }

        .nav-btn span.lbl {
            font-size: 11.5px;
            line-height: 1.1;
            white-space: nowrap;
        }

        .nav-btn:hover {
            color: #fff;
            background: #ffffff0a;
        }

        .nav-btn.active {
            color: #fff;
            background: color-mix(in srgb, var(--c) 16%, transparent);
            border-color: color-mix(in srgb, var(--c) 45%, transparent);
        }

        .nav-btn.active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }

        #list {
            background: #0d0f0d;
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #app.list-collapsed #list {
            border: 0;
        }

        .list-head {
            display: flex;
            gap: 6px;
            padding: 12px;
            border-bottom: 1px solid var(--line);
        }

        .list-head input {
            flex: 1;
            min-width: 0;
        }

        #list-items {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .li {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            margin-bottom: 2px;
            border: 1px solid transparent;
            border-radius: 6px;
            background: none;
            cursor: pointer;
        }

        .li:hover {
            background: #ffffff08;
        }

        .li.active {
            background: #e9c17615;
            border-color: #e9c17645;
        }

        .li .t {
            font-weight: 600;
            font-size: 12.5px;
        }

        .li.active .t {
            color: var(--gold);
        }

        .li .s {
            font-size: 10.5px;
            color: var(--ink-faint);
        }

        .li .bad {
            color: var(--red);
            font-size: 10px;
            margin-left: 4px;
        }

        #main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #topbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        #topbar .brand {
            font: 600 18px 'Newsreader', serif;
            color: var(--gold);
        }

        #folder-name {
            color: var(--ink-faint);
            font-size: 11px;
        }

        .grow {
            flex: 1;
        }

        .pill {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .08em;
            padding: 4px 11px;
            border-radius: 20px;
            border: 1px solid var(--line);
            color: var(--ink-dim);
            cursor: default;
        }

        .pill.ok {
            color: #4ade80;
            border-color: #4ade8040;
        }

        .pill.dirty {
            color: var(--gold);
            border-color: #e9c17650;
        }

        .pill.bad {
            color: var(--red);
            border-color: #ffb4ab50;
            cursor: pointer;
        }

        #editor {
            flex: 1;
            overflow-y: auto;
        }

        /* ---- buttons & inputs ---- */
        .btn {
            padding: 7px 13px;
            border-radius: 6px;
            border: 1px solid var(--line);
            background: #ffffff0a;
            cursor: pointer;
            font-size: 10.5px;
            text-transform: uppercase;
            letter-spacing: .07em;
            white-space: nowrap;
        }

        .btn:hover {
            background: #ffffff18;
        }

        .btn.primary {
            background: var(--gold);
            color: #1a1500;
            border-color: var(--gold);
            font-weight: 700;
        }

        .btn.primary:hover {
            background: #f3d08e;
        }

        .btn.danger {
            background: #7f1d1d33;
            border-color: #f8717140;
            color: #fca5a5;
        }

        .btn.ghost {
            background: none;
            border-style: dashed;
            color: var(--ink-dim);
        }

        .btn.ghost:hover {
            color: var(--gold);
            border-color: var(--gold);
        }

        .btn.icon {
            padding: 4px 7px;
            text-transform: none;
        }

        .btn:disabled {
            opacity: .4;
            cursor: default;
        }

        input:not([type=checkbox]),
        select,
        textarea {
            width: 100%;
            background: #000;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 7px 9px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--gold);
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        textarea.mono {
            font-family: ui-monospace, monospace;
            font-size: 11.5px;
        }

        .invalid {
            border-color: var(--red) !important;
        }

        /* ---- editor ---- */
        .ed-head {
            position: sticky;
            top: 0;
            z-index: 5;
            display: flex;
            align-items: flex-end;
            gap: 14px;
            padding: 14px 24px;
            background: #0d0f0df0;
            backdrop-filter: blur(6px);
            border-bottom: 1px solid var(--line);
        }

        .ed-head h2 {
            font: 600 24px 'Newsreader', serif;
            margin: 0;
        }

        .ed-head .kind {
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: var(--gold);
        }

        .ed-head code {
            color: var(--ink-faint);
            font-size: 11px;
        }

        .ed-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .ed-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 260px;
            gap: 24px;
            padding: 20px 24px 80px;
            align-items: start;
        }

        @media (max-width: 1150px) {
            .ed-wrap {
                grid-template-columns: 1fr;
            }
        }

        .form {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-content: flex-start;
        }

        .fld {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: calc(50% - 7px);
            min-width: 220px;
        }

        .fld.wide {
            width: 100%;
        }

        .fld>label,
        .fs-legend {
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--ink-dim);
        }

        .fld .help {
            font-size: 10.5px;
            color: var(--ink-faint);
        }

        .fld.chk {
            flex-direction: row;
            align-items: center;
            gap: 8px;
            width: auto;
            padding-top: 16px;
        }

        .fld.chk label {
            text-transform: none;
            letter-spacing: 0;
            font-size: 12px;
            color: var(--ink);
        }

        .row {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .row>* {
            min-width: 0;
        }

        .rows {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        fieldset {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 14px;
            margin: 0;
        }

        .fs-legend {
            color: var(--gold);
            font-weight: 700;
            padding: 0 6px;
            cursor: pointer;
            user-select: none;
        }

        fieldset.collapsed>.fs-body {
            display: none;
        }

        .fs-body {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 8px;
        }

        .card {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #00000040;
            padding: 10px 12px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
        }

        .card-head b {
            font-size: 12px;
        }

        .card.collapsed>.fs-body {
            display: none;
        }

        .thumb {
            width: 64px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--line);
            background: #000;
            flex: none;
        }

        .md-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .md-preview {
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            font: 14px/1.6 'Newsreader', serif;
            color: var(--ink-dim);
            max-height: 360px;
            overflow: auto;
            background: #050605;
        }

        .md-preview p {
            margin: 0 0 .7em;
        }

        .md-preview blockquote {
            margin: .8em 0;
            padding-left: 12px;
            border-left: 2px solid #97d39e55;
            font-style: italic;
        }

        .md-preview cite {
            display: block;
            font: 10px 'Manrope';
            text-transform: uppercase;
            letter-spacing: .1em;
            color: var(--green);
            font-style: normal;
        }

        .md-preview .drop-cap {
            float: left;
            font-size: 2.6em;
            line-height: 1;
            padding-right: 6px;
            color: var(--gold);
        }

        .kw-person {
            color: #66c488;
        }

        .kw-place {
            color: #559df7;
        }

        .kw-faction {
            color: #fb923c;
        }

        /* ---- side panel ---- */
        .side {
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: sticky;
            top: 112px;
        }

        .box {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px;
            background: var(--panel);
        }

        .box h4 {
            margin: 0 0 8px;
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--ink-dim);
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin: 0 4px 4px 0;
            padding: 3px 8px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: #ffffff08;
            font-size: 11px;
            cursor: pointer;
        }

        .chip:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .chip small {
            color: var(--ink-faint);
        }

        .issues li {
            color: var(--red);
            font-size: 11.5px;
            margin-bottom: 4px;
        }

        .menu-prev h5 {
            margin: 8px 0 2px;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .14em;
            color: var(--gold);
        }

        .menu-prev div {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 11.5px;
        }

        .menu-prev span:last-child {
            color: var(--gold);
            white-space: nowrap;
        }

        /* item card preview (cards: ../styles/loot-card.css) */
        .card-prev .seg {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
        }

        .card-prev .seg button {
            border: 0;
            background: none;
            padding: 3px 9px;
            font-size: 10.5px;
            cursor: pointer;
            color: var(--ink-dim);
        }

        .card-prev .seg button.on {
            background: #e9c17622;
            color: var(--gold);
        }

        .card-prev__stage {
            display: flex;
            justify-content: center;
            padding: 14px 4px 6px;
        }

        .card-prev .loot-card {
            width: 210px;
        }

        .card-prev .item-sheet {
            width: 100%;
            max-width: 300px;
        }

        :where(.card-prev) :where(h2, p, ul) {
            margin: 0;
        }

        .found-add {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .found-add select {
            flex: 1;
            min-width: 0;
        }

        .warn {
            color: var(--red);
            font-size: 11.5px;
            margin: 0 0 6px;
        }

        .empty {
            padding: 70px 20px;
            text-align: center;
            color: var(--ink-faint);
            font-style: italic;
        }

        /* ---- modal & toast ---- */
        #modal {
            position: fixed;
            inset: 0;
            background: #000b;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        #modal .dlg {
            background: var(--panel);
            border: 1px solid #e9c17640;
            border-radius: 12px;
            width: min(560px, 100%);
            max-height: 90vh;
            overflow: auto;
            padding: 20px;
            box-shadow: 0 20px 60px #000;
        }

        #modal .dlg.wide {
            width: min(1100px, 100%);
        }

        #modal h3 {
            margin: 0 0 12px;
            font: 600 20px 'Newsreader', serif;
            color: var(--gold);
        }

        #modal .foot {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        #placer {
            height: 62vh;
            background: #000;
            border-radius: 8px;
        }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--panel);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 9px 16px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity .25s;
            pointer-events: none;
            z-index: 1100;
        }

        #toast.show {
            opacity: 1;
        }

        .leaflet-container {
            background: #000;
        }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #ffffff55;
        }

        .pin-dot.me {
            background: var(--gold);
            border-color: #fff;
            box-shadow: 0 0 10px var(--gold);
            width: 18px;
            height: 18px;
        }
    </style>

    <!-- Live-reload servers (VS Code Live Server...) reload a page whenever a file changes,
         and saving here changes files: the page would reset, possibly before every file
         is written. They listen through a WebSocket and this page needs none, so it gets
         a dummy one. Other pages of the site keep reloading as usual. -->
    <script>
        window.WebSocket = class {
            constructor() { console.info('Athenaeum dashboard: live reload is off on this page.'); }
            send() { } close() { } addEventListener() { } removeEventListener() { }
        };
    </script>

    <!-- The dashboard reads and writes the files itself, through the linked folder. -->
    <script>window.Athenaeum = { manualLoad: true };</script>
    <script src="../data/schema.js"></script>
    <script src="../scripts/core/markdown.js"></script>
    <script src="../scripts/core/store.js"></script>
    <script src="../scripts/core/seal.js"></script>
    <script src="../scripts/tavern-menu.js"></script>
    <script src="../scripts/loot-card.js"></script>
</head>

<body>
    <div id="gate" style="visibility:hidden">
        <span class="material-symbols-outlined" style="font-size:52px;color:var(--gold)">folder_open</span>
        <h1>Athenaeum Dashboard</h1>
        <p>Link the website's root folder (the one holding <code>index.html</code> and <code>data/</code>). The
            dashboard reads and saves the data files there directly; nothing is uploaded.</p>
        <div class="row">
            <button id="reopen-btn" class="btn primary" hidden></button>
            <button id="link-btn" class="btn">Link Project Folder</button>
        </div>
        <p id="gate-error" class="err" hidden></p>
        <p style="font-size:11px;color:var(--ink-faint)">Chrome, Edge or Brave (File System Access API).</p>
    </div>

    <div id="app" hidden>
        <nav id="nav"></nav>
        <section id="list">
            <div class="list-head">
                <input id="search" placeholder="Search…" />
                <button id="new-btn" class="btn ghost">+ New</button>
            </div>
            <div id="list-items"></div>
        </section>
        <section id="main">
            <div id="topbar">
                <button id="collapse-btn" class="btn icon" title="Hide the list"><span
                        class="material-symbols-outlined">left_panel_close</span></button>
                <span class="brand">Athenaeum</span>
                <span id="folder-name"></span>
                <span class="grow"></span>
                <span id="issues-pill" class="pill" hidden></span>
                <span id="save-pill" class="pill ok">Saved</span>
                <button id="reload-btn" class="btn">Reload from disk</button>
                <button id="save-btn" class="btn primary">Save</button>
            </div>
            <div id="editor"></div>
        </section>
    </div>

    <div id="modal" hidden></div>
    <div id="toast"></div>

    <script src="dashboard.js"></script>
</body>

</html>
