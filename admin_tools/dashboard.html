<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athenaeum Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif:wght@700&display=swap"
        rel="stylesheet" />
    <!-- the item, spell, deity and notice previews use the site's own styles -->
    <link href="../styles/tokens.css" rel="stylesheet" />
    <link href="../styles/loot-card.css" rel="stylesheet" />
    <link href="../styles/notice-board.css" rel="stylesheet" />
    <link href="../styles/spell-card.css" rel="stylesheet" />
    <link href="../styles/deity-card.css" rel="stylesheet" />
    <link href="../styles/looks.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* =============================================================
           TOKENS
           ============================================================= */
        :root {
            --gold: #e9c176;
            --gold-soft: #f3d79f;
            --gold-ink: #1d1604;
            --green: #86d39a;
            --amber: #f2b84b;
            --red: #ff9f94;
            --bg: #0b0c0b;
            --panel: #111311;
            --panel-2: #171917;
            --card: #131513;
            --field: #1b1d1b;
            --field-hover: #202320;
            --line: rgba(255, 255, 255, .07);
            --line-2: rgba(255, 255, 255, .13);
            --ink: #e7e8e4;
            --ink-dim: #adb1aa;
            --ink-faint: #7b7f78;
            --r: 8px;
            --topbar-h: 54px;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.5 'Manrope', system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select, textarea { font: inherit; color: inherit; }
        a { color: var(--gold); }
        [hidden] { display: none !important; }
        code { font: 11.5px ui-monospace, 'Cascadia Code', monospace; }

        .material-symbols-outlined {
            font-size: 18px;
            line-height: 1;
            vertical-align: middle;
            user-select: none;
        }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: #2a2d2a; border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
        ::-webkit-scrollbar-thumb:hover { background-color: #3a3e3a; }
        ::selection { background: #e9c17655; }

        .muted { color: var(--ink-faint); }
        .small { font-size: 12px; }
        .err { color: var(--red); margin: 0; min-height: 1em; }
        .warn { color: var(--red); font-size: 12.5px; margin: 4px 0; }
        .hint { margin: 10px 0 0; font-size: 12px; line-height: 1.45; color: var(--ink-faint); }
        .row { display: flex; gap: 8px; align-items: center; min-width: 0; }
        .row > * { min-width: 0; }
        .row.wrap { flex-wrap: wrap; margin-top: 10px; }
        .stack { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
        .grow { flex: 1; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); flex: none; box-shadow: 0 0 0 3px #e9c17622; }

        /* =============================================================
           GATE
           ============================================================= */
        #gate {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 16px; text-align: center; padding: 24px;
            background: radial-gradient(ellipse at 50% 35%, #1a1810 0%, var(--bg) 60%);
        }
        #gate h1 { font: 600 38px 'Newsreader', serif; color: var(--gold); margin: 0; }
        #gate p { max-width: 460px; color: var(--ink-dim); margin: 0; }
        #gate .err { color: var(--red); }

        /* =============================================================
           SHELL: nav rail · list · main
           ============================================================= */
        #app {
            --nav-w: 64px;
            --list-w: 288px;
            display: grid;
            grid-template-columns: var(--nav-w) var(--list-w) minmax(0, 1fr);
            height: 100vh;
            transition: grid-template-columns .18s ease;
        }
        #app.nav-open { --nav-w: 212px; }
        #app.list-collapsed, #app.no-list { --list-w: 0px; }

        /* ---- nav: an icon rail, or the full menu (pin) ---- */
        #nav {
            display: flex; flex-direction: column;
            background: var(--panel);
            border-right: 1px solid var(--line);
            min-height: 0;
            overflow: hidden;
        }
        .nav-mark {
            flex: none;
            height: var(--topbar-h);
            display: flex; align-items: center; justify-content: center;
            font: 600 26px 'Newsreader', serif; color: var(--gold);
            border-bottom: 1px solid var(--line);
        }
        #nav-items {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column;
            overflow-y: auto; overflow-x: hidden;
            padding: 6px 8px 10px;
            scrollbar-width: none;
        }
        .nav-sec { display: contents; }
        .nav-group {
            flex: none;
            height: 14px; margin: 6px 4px 1px;
            display: flex; align-items: center;
        }
        .nav-group span {
            font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
            color: var(--c); white-space: nowrap;
        }
        #app:not(.nav-open) .nav-group span { display: none; }
        #app:not(.nav-open) .nav-group::before {
            content: ''; display: block; width: 100%; height: 2px; border-radius: 2px;
            background: color-mix(in srgb, var(--c) 55%, transparent);
        }
        .nav-btn {
            position: relative;
            flex: 0 1 34px; min-height: 24px;
            display: flex; align-items: center; gap: 10px;
            width: 100%; padding: 0 10px;
            border: 0; border-radius: 8px;
            background: none; color: var(--ink-dim);
            text-align: left; cursor: pointer;
        }
        #app:not(.nav-open) .nav-btn { justify-content: center; padding: 0; }
        .nav-btn .material-symbols-outlined { font-size: 20px; color: var(--c, var(--ink-dim)); }
        .nav-btn .lbl { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .nav-btn .cnt { font-size: 11px; color: var(--ink-faint); }
        #app:not(.nav-open) .nav-btn .lbl, #app:not(.nav-open) .nav-btn .cnt { display: none; }
        .nav-btn .dot { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; box-shadow: none; }
        #app.nav-open .nav-btn .dot { position: static; }
        .nav-btn:hover { color: #fff; background: #ffffff0a; }
        .nav-btn.active { color: #fff; background: color-mix(in srgb, var(--c) 17%, transparent); }
        .nav-btn.active::before {
            content: ''; position: absolute; left: -8px; top: 22%; bottom: 22%;
            width: 3px; border-radius: 0 3px 3px 0; background: var(--c);
        }
        .nav-btn.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        .nav-pin { flex: none; height: 44px; border-top: 1px solid var(--line); border-radius: 0; --c: var(--ink-faint); }

        #tip {
            position: fixed; z-index: 1200;
            background: #262926; color: #fff;
            font-size: 12.5px; padding: 5px 9px; border-radius: 6px;
            box-shadow: 0 6px 20px #000a; pointer-events: none; white-space: nowrap;
        }

        /* ---- list ---- */
        #list {
            display: flex; flex-direction: column; min-height: 0; min-width: 0;
            background: #0e100e;
            border-right: 1px solid var(--line);
            overflow: hidden;
        }
        #app.list-collapsed #list, #app.no-list #list { border: 0; }
        .list-head { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
        .list-title-row { display: flex; align-items: center; gap: 8px; height: 30px; }
        #list-title { flex: 1; margin: 0; font: 600 19px 'Newsreader', serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #list-title span { font: 500 12px 'Manrope'; color: var(--ink-faint); margin-left: 4px; }
        .search { position: relative; }
        .search .material-symbols-outlined { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); pointer-events: none; }
        .search input { padding-left: 34px !important; }
        #list-items { flex: 1; overflow-y: auto; padding: 4px 8px 20px; }
        .lg {
            position: sticky; top: 0; z-index: 1;
            display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
            padding: 12px 8px 5px;
            background: linear-gradient(#0e100e 75%, #0e100e00);
            font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint);
        }
        .lg span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .lg small { font-weight: 500; letter-spacing: 0; }
        .li {
            display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; column-gap: 6px;
            width: 100%; text-align: left;
            padding: 7px 10px; margin-bottom: 1px;
            border: 1px solid transparent; border-radius: 8px;
            background: none; cursor: pointer;
        }
        .li:hover { background: #ffffff08; }
        /* a POI inside another POI: indented under it, with a rule down the side */
        .li.nested { width: auto; margin-left: calc(var(--depth, 1) * 16px); padding-left: 12px; border-radius: 0 8px 8px 0; box-shadow: -1px 0 0 #e9c17640; }
        .li.nested .t { font-weight: 500; font-size: 13px; }
        .li.active { background: #e9c17614; border-color: #e9c1763d; }
        .li .t { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .li.active .t { color: var(--gold); }
        /* drag to reorder (types with no fixed order): a gold line where it will land */
        .li[draggable="true"] { position: relative; }
        .li.dragging { opacity: .4; }
        .li.drop-before::before, .li.drop-after::after {
            content: ''; position: absolute; left: 4px; right: 4px; height: 2px; border-radius: 2px;
            background: var(--gold); box-shadow: 0 0 6px #e9c17680; pointer-events: none;
        }
        .li.drop-before::before { top: -2px; }
        .li.drop-after::after { bottom: -2px; }
        .li .s { grid-column: 1 / -1; font-size: 12px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .li .bad {
            min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
            background: #ff9f9422; color: var(--red); font-size: 11px; font-weight: 700; text-align: center; line-height: 18px;
        }

        /* ---- main ---- */
        #main { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
        #topbar {
            flex: none; height: var(--topbar-h);
            display: flex; align-items: center; gap: 10px;
            padding: 0 16px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }
        #topbar .brand { font: 600 19px 'Newsreader', serif; color: var(--gold); white-space: nowrap; }
        #folder-name { color: var(--ink-faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .qo-btn { color: var(--ink-faint) !important; min-width: 220px; justify-content: flex-start !important; }
        .qo-btn kbd { margin-left: auto; }
        kbd {
            font: 600 10.5px 'Manrope'; color: var(--ink-dim);
            border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px;
        }
        .pill {
            font-size: 12px; font-weight: 600;
            padding: 5px 12px; border-radius: 20px;
            border: 1px solid var(--line-2); color: var(--ink-dim);
            white-space: nowrap; cursor: default; background: none;
        }
        .pill.ok { color: var(--green); border-color: #86d39a40; }
        .pill.dirty { color: var(--gold); border-color: #e9c17660; background: #e9c17612; }
        .pill.bad { color: var(--red); border-color: #ff9f9460; background: #ff9f9412; cursor: pointer; }
        .pill.warn { color: var(--amber); border-color: #f2b84b55; cursor: pointer; }

        #editor { flex: 1; overflow-y: auto; scroll-padding-top: calc(var(--head-h, 120px) + 12px); }

        /* =============================================================
           BUTTONS & INPUTS
           ============================================================= */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            height: 34px; padding: 0 13px;
            border-radius: var(--r);
            border: 1px solid var(--line-2);
            background: #ffffff08;
            font-size: 13px; font-weight: 600;
            white-space: nowrap; cursor: pointer; text-decoration: none; color: var(--ink);
        }
        .btn .material-symbols-outlined { font-size: 18px; }
        .btn:hover { background: #ffffff14; }
        .btn:focus-visible, .nav-btn:focus-visible, .li:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
        .btn.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
        .btn.primary:hover { background: var(--gold-soft); }
        .btn.danger { background: #ff9f9410; border-color: #ff9f9440; color: var(--red); }
        .btn.danger:hover { background: #ff9f9422; }
        .btn.ghost { background: none; border-style: dashed; color: var(--ink-dim); }
        .btn.ghost:hover { color: var(--gold); border-color: var(--gold); }
        .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
        .btn.icon { width: 34px; padding: 0; }
        .btn.icon.on, .btn.sm.on { color: var(--gold); border-color: #e9c17660; background: #e9c17614; }
        .btn:disabled { opacity: .35; cursor: default; }

        input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]), select, textarea {
            width: 100%;
            background: var(--field);
            border: 1px solid var(--line-2);
            border-radius: var(--r);
            padding: 0 11px;
            height: 36px;
            outline: none;
            transition: border-color .12s, box-shadow .12s, background .12s;
        }
        textarea { padding: 8px 11px !important; height: auto; min-height: 60px; resize: vertical; line-height: 1.55; }
        textarea.md { min-height: 140px; }
        textarea.mono { font: 12.5px/1.5 ui-monospace, monospace; }
        input:hover:not(:focus), select:hover:not(:focus), textarea:hover:not(:focus) { background: var(--field-hover); }
        input:focus, select:focus, textarea:focus { border-color: var(--gold) !important; box-shadow: 0 0 0 3px #e9c1761f; }
        select { cursor: pointer; padding-right: 6px; }
        input[type=date], input[type=time], select { color-scheme: dark; }
        input[type=checkbox] { accent-color: var(--gold); width: 16px; height: 16px; margin: 0; flex: none; cursor: pointer; }
        input[type=range] { accent-color: var(--gold); flex: 1; }
        input.num-s { width: 92px !important; flex: none; }
        input.num-m { width: 110px !important; flex: none; }
        .focus-ctl { display: flex; align-items: center; gap: 8px; }
        .focus-ctl input[type=range] { min-width: 60px; }
        .swatch { width: 36px; height: 36px; padding: 0; border: 1px solid var(--line-2); border-radius: var(--r); background: none; cursor: pointer; flex: none; }
        .swatch::-webkit-color-swatch-wrapper { padding: 4px; }
        .swatch::-webkit-color-swatch { border: 0; border-radius: 4px; }
        .invalid { border-color: var(--red) !important; }

        /* =============================================================
           EDITOR
           ============================================================= */
        .ed-head {
            position: sticky; top: 0; z-index: 6;
            padding: 16px 28px 0;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line);
        }
        .ed-top { display: flex; align-items: flex-end; gap: 16px; padding-bottom: 12px; }
        .ed-title { flex: 1; min-width: 0; }
        .ed-head .kind {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--c);
        }
        .ed-head .kind .material-symbols-outlined { font-size: 16px; }
        .ed-head .kind .dot { margin-left: 4px; }
        .ed-head h2 { font: 600 28px/1.15 'Newsreader', serif; margin: 2px 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ed-head code { color: var(--ink-faint); }
        .ed-actions { display: flex; gap: 8px; flex: none; }
        .sec-index { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin: 0 -6px; }
        .sec-index a {
            flex: none;
            padding: 8px 10px 10px;
            font-size: 13px; font-weight: 600; color: var(--ink-faint); text-decoration: none;
            border-bottom: 2px solid transparent;
        }
        .sec-index a:hover { color: var(--ink); }
        .sec-index a.on { color: var(--gold); border-bottom-color: var(--gold); }
        .sec-index a.absent { opacity: .5; font-weight: 500; }

        .ed-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 340px;
            gap: 24px;
            padding: 20px 28px 120px;
            align-items: start;
        }
        .ed-wrap.no-side { grid-template-columns: minmax(0, 1fr); }
        .ed-wrap.no-side .side { display: none; }
        .form { display: flex; flex-direction: column; gap: 16px; min-width: 0; max-width: 1100px; }

        /* ---- section cards ---- */
        .sec {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            scroll-margin-top: calc(var(--head-h, 120px) + 12px);
        }
        .sec-head {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 20px;
            cursor: pointer; user-select: none;
        }
        .sec-head > .material-symbols-outlined:first-child { color: var(--gold); opacity: .8; font-size: 20px; }
        .sec-head h3 { flex: 1; margin: 0; font: 600 18px 'Newsreader', serif; }
        .chev { color: var(--ink-faint); transition: transform .15s; }
        .collapsed > .sec-head .chev, .card.collapsed .chev { transform: rotate(-90deg); }
        .sec-body { padding: 4px 20px 20px; container-type: inline-size; }
        .sec-body > .help, .sub > .help { margin: -4px 0 14px; }
        .sub > .help { margin: -6px 0 2px; }
        .sec.collapsed .sec-body { display: none; }
        .sec.absent { background: none; border-style: dashed; }
        .sec.absent .sec-head h3 { color: var(--ink-dim); }

        /* ---- the field grid ---- */
        .grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 16px 18px;
            align-items: start;
            container-type: inline-size;
        }
        .w-3 { grid-column: span 3; }
        .w-4 { grid-column: span 4; }
        .w-6 { grid-column: span 6; }
        .w-12 { grid-column: 1 / -1; }
        @container (max-width: 700px) {
            .w-3 { grid-column: span 6; }
            .w-4 { grid-column: span 6; }
        }
        @container (max-width: 460px) {
            .w-3, .w-4, .w-6 { grid-column: 1 / -1; }
        }
        .fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .fld label, .sub-head label, .md-head label {
            font-size: 12.5px; font-weight: 600; color: var(--ink-dim);
        }
        .req { color: var(--gold); font-style: normal; margin-left: 2px; }
        .lock { font-size: 14px; color: var(--amber); margin-left: 2px; vertical-align: -2px; }
        .help { margin: 0; font-size: 12px; line-height: 1.45; color: var(--ink-faint); }
        .fld-box { padding: 14px 16px; border-radius: 10px; background: #ffffff05; border: 1px solid var(--line); }
        .mini { font-size: 12px; color: var(--ink-faint); flex: none; }
        .map-row { flex-wrap: wrap; }
        .map-row select, .map-row input:not(.num-s) { width: auto !important; min-width: 150px; flex: 1; }
        .sealed-status { margin: 0; font-style: italic; color: var(--ink-dim); }

        /* checkboxes: a row of small cards */
        .chk-row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
        .chk {
            display: flex; align-items: flex-start; gap: 10px;
            padding: 9px 14px 9px 12px;
            border: 1px solid var(--line-2); border-radius: 10px;
            background: #ffffff04; cursor: pointer;
            max-width: 100%;
        }
        .chk:hover { background: #ffffff09; }
        .chk:has(input:checked) { border-color: #e9c17660; background: #e9c1760f; }
        .chk input { margin-top: 2px; }
        .chk b { display: block; font-size: 13px; font-weight: 600; }
        .chk small { display: block; font-size: 11.5px; color: var(--ink-faint); max-width: 300px; line-height: 1.4; }

        /* images */
        .img-row .thumb {
            width: 56px; height: 42px; flex: none;
            object-fit: cover; border-radius: 6px;
            border: 1px solid var(--line-2); background: #000;
        }
        .thumb.none { opacity: .25; }
        .icon-prev {
            width: 36px; height: 36px; flex: none;
            display: flex !important; align-items: center; justify-content: center;
            font-size: 22px !important; color: var(--gold);
            border: 1px solid var(--line-2); border-radius: var(--r); background: var(--field);
        }

        /* markdown */
        .md-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .md-tools { display: flex; align-items: center; gap: 8px; }
        .hint-i { color: var(--ink-faint); cursor: help; font-size: 18px; }
        .md-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .md-preview {
            border: 1px solid var(--line); border-radius: var(--r);
            padding: 12px 16px;
            font: 16px/1.65 'Newsreader', serif; color: var(--ink-dim);
            max-height: 70vh; overflow: auto; background: #070807;
        }
        .md-preview p { margin: 0 0 .8em; }
        .md-preview blockquote { margin: .8em 0; padding-left: 12px; border-left: 2px solid #97d39e55; font-style: italic; }
        .md-preview cite { display: block; font: 10px 'Manrope'; text-transform: uppercase; letter-spacing: .1em; color: var(--green); font-style: normal; }

        /* list fields with an enum: checkboxes (tavern games, shop shelves) */

        .enum-set__opt { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink); cursor: pointer; }

        /* nested objects and lists of objects */

        .card-head b { display: flex; align-items: center; gap: 4px; font-size: 13.5px; min-width: 0; }

        .otd { min-width: 0; }

        /* ---- side panel: previews and links ---- */
        .side {
            position: sticky; top: calc(var(--head-h, 120px) + 20px);
            max-height: calc(100vh - var(--topbar-h) - var(--head-h, 120px) - 40px);

        }

        .ed-wrap.side-toggled .side { display: none; }
        @media (max-width: 1360px) {
            .ed-wrap { grid-template-columns: minmax(0, 1fr); }

                display: none;
                position: fixed; top: var(--topbar-h); right: 0; bottom: 0; z-index: 40;
                width: 360px; max-height: none;
                padding: 0 14px 20px;
                background: var(--panel); border-left: 1px solid var(--line-2);
                box-shadow: -20px 0 50px #000b;
            }

        }

        }

        .issues { margin: 0; padding-left: 18px; }

        .issues-h { margin: 16px 0 8px; font-size: 13px; }
        .chip {
            display: inline-flex; align-items: center; gap: 5px;
            margin: 0 5px 5px 0; padding: 3px 9px;

        }
        .chip:hover { border-color: var(--gold); color: var(--gold); }
        .chip small { color: var(--ink-faint); font-size: 11px; }
        .add-here { margin-top: 10px; height: auto !important; min-height: 32px; padding: 6px 12px; white-space: normal; text-align: left; justify-content: flex-start; font-size: 12.5px; }
        .found-add { margin-top: 10px; }
        .found-add select { flex: 1; height: 34px; }
        .up-list { margin: 0; padding-left: 18px; }

        .menu-prev h5 { margin: 10px 0 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: var(--gold); }
        .menu-prev div { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
        .menu-prev span:last-child { color: var(--gold); white-space: nowrap; }

        /* rumours and notices of a POI / settlement (scripts/market.js) */
        .mkt-list { list-style: none; margin: 4px 0 0; padding: 0; }
        .mkt-list li { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; padding: 6px 8px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
        .mkt-list li:hover { background: #ffffff0a; }
        .mkt-list li.out { color: var(--ink-faint); }
        .mkt-list small { grid-column: 1 / -1; color: var(--ink-faint); font-size: 11px; }
        .truth { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-faint); white-space: nowrap; }

        .notice-prev .notice-board__grid { grid-template-columns: 1fr; }

        /* card previews (cards: ../styles/loot-card.css, spell-card.css, deity-card.css) */
        .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
        .seg button { border: 0; background: none; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--ink-dim); }
        .seg button.on { background: #e9c17622; color: var(--gold); }
        .card-prev__stage { display: flex; justify-content: center; padding: 14px 4px 6px; }

        .card-prev .item-sheet { width: 100%; max-width: 310px; }
        .card-prev .spell-card { width: 220px; }
        .card-prev .spell-card--open { width: 100%; max-width: 310px; }
        .card-prev .spell-card:hover { transform: none; }
        .card-prev__stage--deity { padding-top: 26px; }
        /* Bestiary window preview: same shape as the pop-up's picture on a computer (about 1:2) */
        .frame-prev { position: relative; width: 170px; aspect-ratio: 427 / 832; margin: 10px auto 0; overflow: hidden; border-radius: 6px; background: #000; border: 1px solid var(--line, #333); }
        .frame-prev img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        /* Look preview (POIs, creatures): a small mock of the page, drawn with

        .look-prev {

            background: var(--look-page, var(--lp-page)); color: var(--look-ink, #e2e3df);

        .look-prev > :not(.look-banner) { position: relative; z-index: 1; }
        .look-prev__crumbs { margin: 0 0 8px; font: 700 8.5px 'Manrope'; letter-spacing: .12em; text-transform: uppercase; color: var(--look-accent, #e9c176); }
        .look-prev__box {
            margin-top: 8px; padding: 12px 14px; border-radius: 4px;
            border: 1px solid rgb(255 255 255 / .06);
            background: var(--look-panel, var(--lp-panel));
        }
        .look-prev__box--card { background: var(--look-card, var(--lp-card)); border-color: var(--look-card-edge, #3a2d1a); text-align: center; }
        .look-prev__eyebrow { margin: 0 0 3px; font: 700 8.5px 'Manrope'; letter-spacing: .26em; text-transform: uppercase; color: var(--look-accent, #e9c176); }
        .look-prev__title { margin: 0; font: 700 21px/1.1 var(--look-font-title, 'Noto Serif'), serif; color: var(--look-ink, #fff); }
        .look-prev__sub { margin: 4px 0 0; font-style: italic; font-size: 13px; color: var(--look-ink-dim, #c3c8c0); }
        .look-prev__label { margin: 0 0 6px; padding-bottom: 5px; border-bottom: 1px solid rgb(255 255 255 / .07); font: 700 8.5px 'Manrope'; letter-spacing: .22em; text-transform: uppercase; color: var(--look-ink-faint, #8d928b); }
        .look-prev__text { margin: 0; font-size: 13px; line-height: 1.5; color: var(--look-ink-dim, #c3c8c0); }
        .look-prev__text b { color: var(--look-accent, #e9c176); font-weight: 600; }
        .look-prev__heading { margin: 0; font: 700 16px var(--look-font-title, 'Noto Serif'), serif; color: var(--look-accent-soft, #dab36a); }
        .look-prev__rule { width: 70px; height: 1px; margin: 8px auto 10px; background: linear-gradient(to right, transparent, var(--look-accent, #e9c176), transparent); }
        .look-prev__item { display: flex; align-items: baseline; gap: 6px; font: 13px var(--look-font-title, 'Noto Serif'), serif; text-align: left; }
        .look-prev__item i { flex: 1; border-bottom: 1px dotted color-mix(in srgb, var(--look-accent, #e9c176) 35%, transparent); }
        .look-prev__item b { font: 700 11px 'Manrope'; color: var(--look-accent, #e9c176); }
        .look-prev__bar { height: 4px; margin: 4px 0 9px; border-radius: 4px; background: rgb(255 255 255 / .06); }
        .look-prev__bar span { display: block; height: 100%; border-radius: inherit; background: var(--look-accent, #e9c176); box-shadow: 0 0 8px color-mix(in srgb, var(--look-accent, #e9c176) 50%, transparent); }
        .look-prev__tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .look-prev__tag { padding: 3px 7px; border: 1px solid color-mix(in srgb, var(--look-tag-ink, #fff) 14%, transparent); background: color-mix(in srgb, var(--look-tag, rgb(49 46 129)) 80%, transparent);
            font: 700 8px 'Manrope'; letter-spacing: .1em; text-transform: uppercase; color: var(--look-tag-ink, rgb(255 255 255 / .6)); }
        .look-prev__stat { display: flex; justify-content: space-between; font: 700 8.5px 'Manrope'; letter-spacing: .1em; text-transform: uppercase; color: var(--look-ink-dim, #c3c8c0); }
        .card-prev .deity-card { width: 220px; }
        .deity-prev__tier { text-align: center; font-size: 12.5px; color: var(--ink-faint); }

        :where(.card-prev) :where(h2, p, ul) { margin: 0; }

        .empty { padding: 40px 16px; text-align: center; color: var(--ink-faint); font-style: italic; }

        .empty.big > .material-symbols-outlined { font-size: 48px; color: #ffffff22; }

    <script>

<body>
    <div id="gate" style="visibility:hidden">
        <span class="material-symbols-outlined" style="font-size:52px;color:var(--gold)">folder_open</span>

            dashboard reads and saves the data files there directly; nothing is uploaded.</p>

            <button id="reopen-btn" class="btn primary" hidden></button>
            <button id="link-btn" class="btn">Link the project folder</button>

        <p id="gate-error" class="err" hidden></p>
        <p class="muted small">Chrome, Edge or Brave (File System Access API).</p>

            </div>

        </section>

                        class="material-symbols-outlined">view_sidebar</span></button>

                <span class="grow"></span>
                <button id="qo-btn" class="btn qo-btn" title="Find any record"><span class="material-symbols-outlined">search</span>Find anything<kbd>Ctrl K</kbd></button>
                <button id="issues-pill" class="pill" hidden></button>
                <span id="save-pill" class="pill ok">All saved</span>
                <button id="reload-btn" class="btn icon" title="Reload from disk (drops unsaved changes)"><span class="material-symbols-outlined">refresh</span></button>
                <button id="save-btn" class="btn primary" title="Ctrl S"><span class="material-symbols-outlined">save</span>Save</button>
            </div>
            <div id="editor"></div>
        </section>
    </div>

    <div id="modal" hidden></div>
    <div id="toast" role="status"></div>
    <div id="tip" hidden></div>

    <script src="dashboard.js"></script>
</body>

</html>
