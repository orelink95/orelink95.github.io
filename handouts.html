<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Archival Handouts — The Athenaeum Vault</title>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link href="styles/tokens.css" rel="stylesheet" />
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />
    <link href="styles/pages/handouts.css" rel="stylesheet" />
    <link href="styles/main-style.css" rel="stylesheet" />
    
    <script src="scripts/general-scripts.js"></script>
    <script src="data/schema.js"></script>
    <script src="scripts/core/markdown.js"></script>
    <script src="scripts/core/store.js"></script>
    <script src="scripts/handouts-scripts.js"></script>
</head>

<body class="page mystical-bg">

    <div id="dust-container" class="dust-layer"></div>
    <div id="header-placeholder" class="header-slot"></div>
    <div id="library-sidebar-placeholder"></div>

    <main class="handouts-main">
        
        <div class="handouts-head">
            <div class="handouts-head__intro">
                <nav class="breadcrumbs">
                    <a href="library.html" class="breadcrumbs__link">Library</a>
                    <span class="breadcrumbs__separator material-symbols-outlined">chevron_right</span>
                    <a href="library.html" class="breadcrumbs__link">Elder Codex</a>
                    <span class="breadcrumbs__separator material-symbols-outlined">chevron_right</span>
                    <span class="breadcrumbs__current">Archival Handouts</span>
                </nav>
                <h1 class="handouts-head__title">Archival Handouts</h1>
                <p class="handouts-head__lede">Physical evidence, decrypted letters, and field maps recovered by Athenaeum agents.</p>
            </div>
            
            <div class="handout-search">
                <label class="handout-search__label">Search Evidence</label>
                
                <div class="handout-search__fields">
                <div class="handout-search__field">
                    <span class="handout-search__icon material-symbols-outlined">search</span>
                    <input type="text" id="handout-search" placeholder="Enter keyword..." class="handout-search__input">
                </div>
                
                <select id="filter-campaign" class="handout-search__campaign">
                    <option value="all">All Campaigns</option>
                </select>
            </div>
            </div>
        </div>

        <div class="handout-filters" id="handout-filters">
            </div>

        <div id="handout-grid" class="handout-grid">
            </div>

    </main>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadComponent("header-placeholder", "components/library-header.html");
            loadComponent("footer-placeholder", "components/library-footer.html");
            loadComponent("library-sidebar-placeholder", "components/library-sidebar.html");
        });
    </script>
</body>
</html>
