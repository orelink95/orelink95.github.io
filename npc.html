<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dramatis Personae - The Athenaeum Vault</title>
    <link rel="icon" type="image/png" href="/images/EA-favicon.png" />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="styles/tokens.css" rel="stylesheet" />
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />
    <link href="styles/pages/npc.css" rel="stylesheet" />
    <link href="styles/atlas-style.css" rel="stylesheet" />
    <link href="styles/main-style.css" rel="stylesheet" />

    <script src="scripts/general-scripts.js"></script>

    <script src="data/schema.js"></script>
    <script src="scripts/core/markdown.js"></script>
    <script src="scripts/core/store.js"></script>

    <script src="scripts/npc-scripts.js"></script>
</head>

<body class="page">
    <div id="header-placeholder"></div>

    <main class="roster-main archival-bg">
        <div class="roster">
            <header class="roster-header">
                <div class="roster-header__top">
                    <div class="roster-header__intro">
                        <div>
                            <p class="roster-header__eyebrow">The Archival
                                Roster</p>
                            <h2 class="roster-header__title">
                                Dramatis Personae</h2>
                        </div>

                        <div class="archive-links">
                            <span
                                class="archive-links__label">Related
                                Archives:</span>

                            <a href="factions.html"
                                class="archive-link">
                                <span
                                    class="archive-link__icon material-symbols-outlined">swords</span>
                                Factions & Guilds
                            </a>

                            <a href="heroes.html"
                                class="archive-link archive-link--heroes">
                                <span
                                    class="archive-link__icon material-symbols-outlined">local_fire_department</span>
                                Player Heroes
                            </a>
                        </div>
                    </div>

                    <div class="roster-search">
                        <span
                            class="roster-search__icon material-symbols-outlined">search</span>
                        <input type="text" id="search-input" placeholder="Search by name, role, or faction..."
                            class="roster-search__input">
                    </div>
                </div>

                <div
                    class="roster-filters">

                    <div class="relation-tabs custom-scrollbar"
                        id="relation-tabs">
                        <button data-rel="all"
                            class="rel-tab relation-tab is-active relation-tab--all">Any
                            Relation</button>
                        <button data-rel="ally"
                            class="relation-tab rel-tab">Allies</button>
                        <button data-rel="neutral"
                            class="relation-tab rel-tab">Neutral</button>
                        <button data-rel="hostile"
                            class="relation-tab rel-tab">Hostiles</button>
                    </div>

                    <div class="roster-filters__selects">
                        <span
                            class="roster-filters__label">Filter
                            By:</span>

                        <div class="filter-select">
                            <select id="filter-settlement"
                                class="filter-select__input">
                                <option value="all">All Locations</option>
                            </select>
                            <span
                                class="filter-select__chevron material-symbols-outlined">expand_more</span>
                        </div>

                        <div class="filter-select">
                            <select id="filter-affiliation"
                                class="filter-select__input">
                                <option value="all">All Affiliations</option>
                            </select>
                            <span
                                class="filter-select__chevron material-symbols-outlined">expand_more</span>
                        </div>
                    </div>
                </div>
            </header>

            <div id="npc-grid"
                class="npc-grid">
            </div>
        </div>
    </main>

    <div id="npc-modal"
        class="npc-modal hidden">
        <div
            class="npc-modal__card">

            <div class="npc-modal__portrait">
                <img id="modal-npc-img" class="npc-modal__img" src="" alt="Character Portrait" />
                <div class="npc-modal__fade-side">
                </div>
                <div class="npc-modal__fade-bottom"></div>
            </div>

            <div class="npc-modal__content custom-scrollbar">
                <button onclick="closeNPCModal()"
                    class="npc-modal__close">
                    <span class="material-symbols-outlined">close</span>
                </button>

                <p id="modal-npc-role" class="npc-modal__role"></p>
                <h2 id="modal-npc-name" class="npc-modal__name"></h2>
                <p id="modal-npc-quote" class="npc-modal__quote font-newsreader">""</p>

                <div class="npc-modal__facts">
                    <div>
                        <p class="npc-modal__fact-label">Species</p>
                        <p id="modal-npc-species" class="npc-modal__fact-value"></p>
                    </div>
                    <div>
                        <p class="npc-modal__fact-label">Age / Gender</p>
                        <p id="modal-npc-demographics" class="npc-modal__fact-value"></p>
                    </div>
                    <div>
                        <p class="npc-modal__fact-label">Affiliation</p>
                        <p id="modal-npc-affiliation" class="npc-modal__fact-value"></p>
                    </div>
                    <div class="npc-modal__whereabouts">
                        <p class="npc-modal__fact-label">Known Whereabouts
                        </p>
                        <div class="npc-modal__location">
                            <span class="npc-modal__location-icon material-symbols-outlined">location_on</span>
                            <p id="modal-npc-location" class="npc-modal__location-text"></p>
                        </div>
                    </div>
                </div>

                <h3 class="npc-modal__section-title">Archival Biography</h3>
                <div id="modal-npc-body"
                    class="npc-modal__body">
                </div>

                <div class="npc-secrets">
                    <h3
                        class="npc-secrets__title">
                        <span class="npc-secrets__icon material-symbols-outlined">lock</span> Classified Secrets
                    </h3>

                    <div id="modal-npc-secrets"
                        class="npc-secrets__text font-newsreader">
                    </div>

                    <div
                        class="npc-secrets__veil">
                        <span
                            class="npc-secrets__badge">Hover
                            to Decrypt</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
</body>

</html>
