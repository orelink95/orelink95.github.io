<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>The Pantheon — The Athenaeum Vault</title>
    <link rel="icon" type="image/png" href="/images/EA-favicon.png" />

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link href="styles/tokens.css" rel="stylesheet" />
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />
    <link href="styles/pages/pantheon.css" rel="stylesheet" />
    <link href="styles/main-style.css" rel="stylesheet" />

    <script src="scripts/general-scripts.js"></script>
    <script src="data/schema.js"></script>
    <script src="scripts/core/markdown.js"></script>
    <script src="scripts/core/store.js"></script>
    <script src="scripts/pantheon-scripts.js"></script>
</head>

<body class="page mystical-bg">

    <div id="dust-container" class="dust-layer"></div>
    <div id="header-placeholder" class="header-slot"></div>
    <div id="library-sidebar-placeholder"></div>

    <main class="pantheon-main">
        <div class="pantheon-head">
            <nav class="breadcrumbs" aria-label="Breadcrumb">
                <a href="index.html" class="breadcrumbs__link">Athenaeum</a>
                <span class="breadcrumbs__separator material-symbols-outlined" aria-hidden="true">chevron_right</span>
                <a href="library.html" class="breadcrumbs__link">Black Archive</a>
                <span class="breadcrumbs__separator material-symbols-outlined" aria-hidden="true">chevron_right</span>
                <span class="breadcrumbs__current" aria-current="page">The Pantheon</span>
            </nav>
            <h1 class="pantheon-head__title">The Pantheon</h1>
            <p class="pantheon-head__lede">The gods who are prayed to, feared and bargained with, and the temples raised in their names.</p>
        </div>

        <div id="pantheon-grid" class="pantheon-grid"></div>
    </main>

    <!-- One deity, opened from a card or with ?id=<deity id> -->
    <dialog id="deity-dialog" class="deity-dialog" aria-labelledby="deity-name">
        <button type="button" id="deity-close" class="deity-dialog__close" aria-label="Close">
            <span class="material-symbols-outlined" aria-hidden="true">close</span>
        </button>
        <div id="deity-content" class="deity-dialog__content"></div>
    </dialog>

    <div id="footer-placeholder"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            loadComponent("header-placeholder", "components/library-header.html");
            loadComponent("footer-placeholder", "components/library-footer.html");
            loadComponent("library-sidebar-placeholder", "components/library-sidebar.html");
        });
    </script>
</body>

</html>
