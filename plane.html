<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <link rel="icon" type="image/png" href="/images/EA-favicon.png" />

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <link href="styles/tokens.css" rel="stylesheet" />
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />
    <!-- Leaflet: the maps of the plane -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="styles/atlas-style.css" rel="stylesheet" />
    <link href="styles/looks.css" rel="stylesheet" />
    <link href="styles/pages/plane.css" rel="stylesheet" />
    <link href="styles/main-style.css" rel="stylesheet" />

    <script src="scripts/general-scripts.js"></script>
    <script src="data/schema.js"></script>
    <script src="scripts/core/markdown.js"></script>
    <script src="scripts/core/calendar.js"></script>
    <script src="scripts/core/store.js"></script>
    <script src="scripts/core/look.js"></script>
    <script src="scripts/core/sky.js"></script>
    <script src="scripts/atlas-common.js"></script>
    <script src="scripts/personae.js"></script>
    <script src="scripts/planes-common.js"></script>
    <script src="scripts/plane-themes.js"></script>
    <script src="scripts/plane-scripts.js"></script>
</head>

<!-- The look of the page (body.look--plane-<theme>) comes from the plane's record -->
<body data-section="archive" class="page pp-page">

    <!-- The starry sky, when the plane has no theme of its own (scripts/core/sky.js) -->
    <canvas id="sky" class="pp-sky" aria-hidden="true"></canvas>

    <div id="header-placeholder" class="header-slot"></div>
    <nav class="section-tabs" data-section="archive"></nav>

    <div id="pp-stage" class="pp-stage">
        <!-- The theme's decoration: behind the text, and over it (scripts/plane-themes.js) -->
        <div id="pp-back" class="pp-layer" aria-hidden="true"></div>

        <main class="pp-main">
            <div class="pp-toprow">
                <p id="pp-crumb" class="pp-crumb"></p>
                <label class="pp-campaign" title="Sealed planes, places and residents stay unknown until this campaign has learned them">
                    <span class="sr-only">Viewing as</span>
                    <!-- Shared with Dramatis Personae (scripts/personae.js) -->
                    <select id="pp-campaign" class="pp-select hidden"></select>
                </label>
            </div>
            <section class="pp-hero">
                <div id="pp-sigil" class="pp-sigil"></div>
                <div id="pp-hero-text" class="pp-hero__text"></div>
            </section>
            <div id="pp-content"></div>
        </main>

        <div id="pp-front" class="pp-layer" aria-hidden="true"></div>
    </div>

    <div id="footer-placeholder"></div>

</body>

</html>
