<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Points of Interest - The Athenaeum Vault</title>
    <link rel="icon" type="image/png" href="/images/EA-favicon.png" />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="styles/tokens.css" rel="stylesheet" />
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />
    <link href="styles/pages/pois.css" rel="stylesheet" />
    <link href="styles/atlas-style.css" rel="stylesheet" />
    <link href="styles/main-style.css" rel="stylesheet" />

    <script src="scripts/general-scripts.js"></script>
    <script src="data/schema.js"></script>
    <script src="scripts/core/markdown.js"></script>
    <script src="scripts/core/store.js"></script>
    <script src="scripts/pois-scripts.js"></script>
</head>

<body class="page">
    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <main class="landmarks-main">
        <div class="landmarks">
            <header class="landmarks-header">
                <div>
                    <p class="landmarks-header__eyebrow">Cartographer's Record
                    </p>
                    <h2 class="landmarks-header__title">Enchanted
                        Landmarks</h2>
                </div>

                <div class="landmark-filters">
                    <select id="filter-continent"
                        class="landmark-filter">
                        <option value="all">All Continents</option>
                    </select>
                    <select id="filter-country"
                        class="landmark-filter">
                        <option value="all">All Regions</option>
                    </select>
                    <select id="filter-settlement"
                        class="landmark-filter">
                        <option value="all">All Settlements</option>
                    </select>
                </div>
            </header>

            <div id="poi-grid" class="poi-grid">
            </div>
        </div>
    </main>

    <div id="poi-modal"
        class="poi-modal hidden">
        <div
            class="poi-modal__card">

            <div class="poi-modal__media">
                <img id="modal-img" class="poi-modal__img" src="" />
                <div class="poi-modal__fade-side">
                </div>
                <div class="poi-modal__fade-bottom"></div>
            </div>

            <div class="poi-modal__content custom-scrollbar">
                <button onclick="closePOIModal()"
                    class="poi-modal__close">
                    <span class="material-symbols-outlined">close</span>
                </button>
                <p id="modal-uid" class="poi-modal__uid"></p>
                <h2 id="modal-title" class="poi-modal__title"></h2>
                <div id="modal-body" class="poi-modal__body lore">
                </div>

                <div class="poi-modal__link-row">
                    <a id="modal-page-link" href="#"
                        class="poi-modal__link">
                        Open the Full Entry
                    </a>
                </div>

                <div id="modal-npc-section" class="poi-modal__residents hidden">
                    <h3
                        class="poi-modal__section-title">
                        Known Residents & Associated Contacts</h3>
                    <div id="modal-npcs" class="poi-modal__npcs">
                    </div>
                </div>

                <div class="poi-modal__footer">
                    <div>
                        <p class="poi-modal__fact-label">Location</p>
                        <p id="modal-location" class="poi-modal__location"></p>
                    </div>
                    <div>
                        <p class="poi-modal__fact-label">Archive ID</p>
                        <p id="modal-threat" class="poi-modal__record">POI Record</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="footer-placeholder"></div>
</body>

</html>
