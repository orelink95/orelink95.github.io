<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Settlement View - The Athenaeum Vault</title>
    <link rel="icon" type="image/png" href="/images/EA-favicon.png" />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="styles/tokens.css" rel="stylesheet" />
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />
    <link href="styles/pages/settlement.css" rel="stylesheet" />

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <link href="styles/atlas-style.css" rel="stylesheet" />
    <link href="styles/main-style.css" rel="stylesheet" />
    <link href="styles/notice-board.css" rel="stylesheet" />

    <script src="scripts/general-scripts.js"></script>
    <script src="data/schema.js"></script>
    <script src="scripts/core/markdown.js"></script>
    <script src="scripts/core/store.js"></script>
    <script src="scripts/atlas-common.js"></script>
    <script src="scripts/tavern-menu.js"></script>
    <script src="scripts/market.js"></script>
    <script src="scripts/notice-board.js"></script>
    <script src="scripts/personae.js"></script>
    <script src="scripts/settlement-scripts.js"></script>

</head>

<body
    class="page">

    <div id="header-placeholder"></div>
    <div id="sidebar-placeholder"></div>

    <main
        class="region-main">

        <div id="dynamic-bg-blur"
            class="region-backdrop">
        </div>

        <header class="region-header">
            <!-- filled by Atlas.breadcrumbs (scripts/atlas-common.js) -->
            <nav id="atlas-breadcrumbs" class="breadcrumbs"></nav>
            <h1 id="dynamic-title" class="region-header__title">Loading...
            </h1>
            <p id="dynamic-description"
                class="region-header__summary">Fetching
                archival data...</p>
        </header>

        <div class="settlement-grid">

            <div
                class="lore-panel lore-card">
                <div class="lore-panel__glow"
                    style="background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(233,193,118, 0.08), transparent 40%);">
                </div>
                <span
                    class="lore-panel__watermark material-symbols-outlined"
                    style="font-variation-settings: 'FILL' 1;">menu_book</span>

                <div class="lore-panel__scroll custom-scrollbar">
                    <div class="lore-panel__head">
                        <div class="lore-panel__meta">
                            <span id="lore-entry-id" class="lore-panel__entry">Town Charter</span>
                            <button id="reset-lore-btn" type="button" class="lore-panel__reset hidden"
                                title="Return to Overview">
                                <span class="lore-panel__reset-icon material-symbols-outlined">undo</span>
                                <span class="lore-panel__reset-label">Overview</span>
                            </button>
                        </div>
                        <h2 id="lore-title" class="lore-panel__title">
                            Loading...</h2>
                        <div class="lore-panel__rule"></div>
                    </div>
                    <div id="lore-body" class="lore-panel__body lore">
                    </div>
                </div>
            </div>

            <div class="settlement-map-column">

                <div class="district-picker">

                    <!-- shown when the settlement has more than one district -->
                    <button id="district-toggle-btn" type="button" aria-expanded="false"
                        aria-controls="district-nav-wrapper" class="district-toggle hidden">
                        <span class="district-toggle__icon material-symbols-outlined">map</span>
                        <span class="district-toggle__label">District:</span>
                        <span id="district-current" class="district-toggle__current"></span>
                        <span id="district-chevron"
                            class="district-toggle__chevron material-symbols-outlined">expand_more</span>
                    </button>

                    <div id="district-nav-wrapper"
                        class="district-nav-wrapper">
                        <div id="district-nav"
                            class="district-nav">
                        </div>
                    </div>

                </div>

                <div
                    class="map-frame">
                    <div class="map-frame__inner">
                        <div
                            class="map-frame__corner-tl">
                        </div>
                        <div
                            class="map-frame__corner-tr">
                        </div>
                        <div
                            class="map-frame__corner-bl">
                        </div>
                        <div
                            class="map-frame__corner-br">
                        </div>

                        <div id="settlement-map"
                            class="settlement-map">
                        </div>
                    </div>
                </div>
            </div>

            <div
                class="residents">
                <div class="residents__head">
                    <div class="residents__title-row">
                        <h3 class="residents__title">Local Residents</h3>
                        <span id="dynamic-npc-count"
                            class="residents__count">0 Known</span>
                    </div>
                    <p class="residents__subtitle">Notable figures within the walls.</p>
                </div>

                <div id="dynamic-npc-list" class="residents__list custom-scrollbar">
                </div>
            </div>

        </div>

        <!-- TOWN BOARD: notices whose `where` is this settlement (scripts/notice-board.js) -->
        <section id="town-board-section" class="town-board" aria-labelledby="town-board-title" hidden>
            <div class="town-board__head">
                <div>
                    <h3 id="town-board-title" class="town-board__title">Town Board</h3>
                    <p class="town-board__subtitle">Jobs, bounties and proclamations nailed up in the square.</p>
                </div>
                <label id="town-board-campaign-wrap" class="town-board__campaign" hidden>
                    <span>Campaign</span>
                    <select id="town-board-campaign" class="hidden"></select>
                </label>
            </div>
            <div id="town-board" class="notice-board"></div>
            <p id="town-board-elsewhere" class="town-board__elsewhere" hidden></p>
        </section>

    </main>
    <div id="footer-placeholder"></div>
</body>

</html>
