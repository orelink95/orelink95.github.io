<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>World Atlas - The Athenaeum Vault</title>
    <link rel="icon" type="image/png" href="/images/EA-favicon.png" />
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&amp;family=Newsreader:ital,wght@0,400;0,600;1,400&amp;family=Manrope:wght@400;500;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="styles/tokens.css" rel="stylesheet" />
    <link href="styles/base.css" rel="stylesheet" />
    <link href="styles/components.css" rel="stylesheet" />
    <link href="styles/pages/world.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="styles/atlas-style.css" rel="stylesheet" />
    <link href="styles/main-style.css" rel="stylesheet" />
    <script src="scripts/general-scripts.js"></script>
    <script src="data/schema.js"></script>
    <script src="scripts/core/markdown.js"></script>
    <script src="scripts/core/store.js"></script>
    <script src="scripts/atlas-scripts.js"></script>
</head>

<body
    class="page">
    <input class="hidden" id="sidebar-toggle-input" type="checkbox" />

    <!-- inject Header here -->
    <div id="header-placeholder"></div>

    <!-- inject atlas sidebar here -->
    <div id="sidebar-placeholder"></div>


    <!-- Main Content Canvas -->
    <main class="page-main">

        <header class="atlas-header">
            <div>
                <nav
                    class="breadcrumbs">
                    <span class="breadcrumbs__link">Archive</span>
                    <span class="breadcrumbs__separator material-symbols-outlined">chevron_right</span>
                    <span class="breadcrumbs__current">World</span>
                </nav>
                <h1 class="atlas-header__title">The Known Realms</h1>
            </div>

            <div class="atlas-layers-scroller custom-scrollbar">
                <div class="atlas-layers">
                    <button data-layer="cartographic"
                        class="layer-btn atlas-layer is-active">
                        Landmass
                    </button>
                    <button data-layer="political"
                        class="atlas-layer layer-btn">
                        Political
                    </button>
                    <button data-layer="relic"
                        class="atlas-layer layer-btn">
                        Relic
                    </button>
                </div>
            </div>
        </header>

        <div class="atlas-grid">

            <div
                class="lore-panel lore-card">

                <div class="lore-panel__glow"
                    style="background: radial-gradient(400px circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(233,193,118, 0.08), transparent 40%);">
                </div>

                <span
                    class="lore-panel__watermark material-symbols-outlined"
                    style="font-variation-settings: 'FILL' 1;">auto_stories</span>

                <div class="lore-panel__scroll custom-scrollbar">
                    <div class="lore-panel__head">
                        <div class="lore-panel__meta">
                            <span id="lore-entry-id"
                                class="lore-panel__entry"></span>
                            <button id="reset-lore-btn"
                                class="lore-panel__reset hidden"
                                title="Return to Overview">
                                <span class="lore-panel__reset-icon material-symbols-outlined">undo</span>
                                <span
                                    class="lore-panel__reset-label">Overview</span>
                            </button>
                        </div>
                        <h2 id="lore-title"
                            class="lore-panel__title"></h2>
                        <div class="lore-panel__rule"></div>
                    </div>

                    <div id="lore-body"
                        class="lore-panel__body lore">
                        <!-- filled from data/world.json -->
                    </div>
                </div>
            </div>

            <div class="atlas-map-column">
                <div
                    class="atlas-map-frame">
                    <div
                        class="atlas-map-vignette">
                    </div>

                    <div class="atlas-map-inner">
                        <div
                            class="atlas-map__corner-tl">
                        </div>
                        <div
                            class="atlas-map__corner-tr">
                        </div>
                        <div
                            class="atlas-map__corner-bl">
                        </div>
                        <div
                            class="atlas-map__corner-br">
                        </div>

                        <div id="world-map"
                            class="atlas-map">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="atlas-stats">
            <div class="atlas-stat--settlements">
                <div class="atlas-stat__label">Known
                    Settlements</div>
                <div class="atlas-stat__value--primary">827</div>
                <div class="atlas-stat__note">+4 new settlements this month
                </div>
            </div>
            <div class="atlas-stat--conflicts">
                <div class="atlas-stat__label">Active
                    Factions</div>
                <div class="atlas-stat__value--secondary">48</div>
                <div class="atlas-stat__note">3 currently at war</div>
            </div>
            <div class="atlas-stat--runes">
                <div class="atlas-stat__label">Known
                    Languages</div>
                <div class="atlas-stat__value--tertiary">14</div>
                <div class="atlas-stat__note">Includes Elder Runes</div>
            </div>
            <div class="atlas-stat--archived">
                <div class="atlas-stat__label">Archived
                    Relics</div>
                <div class="atlas-stat__value--neutral">302</div>
                <div class="atlas-stat__note">Security Clearance Level 4</div>
            </div>
        </div>
    </main>
    <div id="footer-placeholder"></div>


</body>

</html>
